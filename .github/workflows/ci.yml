name: CI

# Vérifie chaque proposition de fusion vers main, ainsi que main lui-même.
# Aucun déploiement ici : la mise en ligne est traitée séparément (voir docs/ROADMAP.md).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Une nouvelle exécution annule la précédente sur la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, format, types et build
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v5

      - name: Installation de Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      # Les vérifications sont ordonnées de la plus rapide à la plus lente :
      # un échec de lint arrête le job avant de payer le build.
      - name: Lint
        run: npm run lint

      - name: Formatage
        run: npm run format:check

      # `type-check` génère d'abord les types Next.js (next typegen) : sur un dépôt
      # fraîchement cloné, next-env.d.ts est absent (gitignoré) et sans lui tsc ne sait
      # pas typer les imports d'images.
      - name: Types
        run: npm run type-check

      - name: Build
        run: npm run build
